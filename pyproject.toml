[project]
name = "careers-os"
version = "0.1.0"
description = "Personal AI-assisted job search / career operating system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
jobs = "careers_os.cli:app"
careers = "careers_os.cli:careers_app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (Creative Circle, Greenhouse, Ashby, Lever) — excluded by default",
]
addopts = "-m 'not live'"
