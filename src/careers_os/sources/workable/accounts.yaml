# Workable account slugs to search by default. A slug is the token in
# https://apply.workable.com/api/v1/widget/accounts/<slug>.
#
# Chosen for the two transition paths in docs/discovery.md, not volume:
#   laravel, tighten, 10up — stack-adjacent (Laravel / WordPress companies)
#   huggingface            — target-direction (applied AI / ML systems)
# tighten and 10up had Workable accounts with zero open roles when this
# was written — one cheap request each, kept in case they post.
#
# `jobs search workable --account <slug>` works for any valid slug
# without listing it here first.
accounts:
  - laravel
  - huggingface
  - tighten
  - 10up
  # Phase 6: verified live 2026-10-07 — the account name Workable returns
  # is "RevStar", confirming the board belongs to the company Himalayas
  # was re-listing (5 of its ~28 distinct roles). A US consultancy
  # posting both replacement-track work (Full Stack Web Developer,
  # Software Development Lead) and exploratory-track work (Forward
  # Deployed Engineer for AWS/Databricks/DevOps, Solutions Architect) —
  # the only verified board in the Phase 6 investigation covering both.
  - revstar
