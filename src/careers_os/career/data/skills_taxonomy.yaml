# Canonical skill/theme taxonomy shared by requirement extraction
# (scoring/requirements.py) and evidence matching (career/evidence_matcher.py).
#
# Each entry:
#   aliases:  surface forms to match in free text (case-insensitive, substring)
#   category: RequirementCategory value this skill belongs to when found in
#             a job description
#   adjacent: other canonical skill keys that count as loosely-related
#             substitute evidence (used for partial_match/adjacent_experience
#             classification — never promoted to strong_match)
#
# This is deliberately editable config, not code — see docs/evidence-model.md.

