# Configurable scoring inputs. Edit this file to tune fit scoring —
# nothing here should ever need a code change to adjust.

compensation:
  full_time:
    minimum_annual: 175000
    strong_annual: 200000
  contract:
    minimum_hourly: 85
    strong_hourly: 100
    exceptional_hourly: 150
  # A missing/unpublished compensation figure must never be scored as a
  # rejection — see docs/scoring.md#compensation-fit.
  missing_compensation_penalty: 0.0

work_arrangement:
  preferred:
    - remote
    - hybrid
  # Hybrid is only downweighted relative to remote, never disqualified —
  # "strong hybrid opportunities when strategically compelling" per profile.
  onsite_penalty: 0.35
  hybrid_penalty: 0.1

component_weights:
  # Used only to derive `overall_fit` from the individual components —
  # each component remains independently visible and explained.
  role_fit: 0.30
  technical_fit: 0.20
  career_direction_fit: 0.20
  compensation_fit: 0.15
  work_arrangement_fit: 0.10
  experience_fit: 0.05

freshness_thresholds:
  # Age-in-days boundaries for career/freshness.py — used by `jobs
  # evaluate` and `jobs discover`. A stale posting is never treated as
  # closed, only flagged as old (see docs/pursue-recommendation.md).
  fresh_days: 7
  recent_days: 30
  aging_days: 90

discovery_ranking_weights:
  # Used only by `jobs discover` (Phase 2.5) to order results — see
  # docs/discovery.md#ranking-philosophy. Each dimension (bridge role,
  # immediate opportunity, career direction, overall_fit) stays
  # independently visible in the output; this only affects sort order.
  overall_fit: 0.40
  bridge_role: 0.20
  immediate_opportunity: 0.25
  career_direction: 0.15

# How aggressively `jobs run` (scheduled discovery) surfaces opportunities
# by email — see docs/alerts.md. Switching to `active` later needs no
# code change, only this value.
operating_mode: passive

alert_policy:
  # The pursue-recommendation floor required to send an alert. Never a
  # separate score — this is a threshold on the existing pursue-worthiness
  # decision (career/pursue.py), so an opportunity can't get alerted just
  # for high compensation, a keyword match, or plain eligibility.
  # `verify_first` and `do_not_pursue` are never alert-eligible in either
  # mode, regardless of this setting.
  #
  # `max_alerts_per_run` (Phase 4.1) caps how many notifications one run
  # may send, after related postings are clustered and the strongest
  # representative of each family is ranked using existing fit/pursue
  # signals — see docs/alerts.md#alert-prioritization-and-opportunity-clustering.
  # Crossing `minimum_pursue` makes an opportunity *eligible*; this budget
  # decides how many eligible opportunities actually interrupt you this
  # run. Deferred opportunities are never marked as alerted and remain
  # eligible for a future run.
  passive:
    minimum_pursue: strong_pursue
    max_alerts_per_run: 5
  active:
    minimum_pursue: pursue
    max_alerts_per_run: 5
