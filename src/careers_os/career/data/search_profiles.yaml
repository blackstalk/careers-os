# Discovery search profiles for `jobs discover` (Phase 2.5+). Each profile
# is one or more independent keyword queries run against every available
# source — a job only needs to match ONE query from ONE profile to be
# discovered, never all of them. Add a profile here to make it available
# to `jobs discover --profile <name>`; no code change needed.
#
# Phase 2.5's original anchors are technologies with strong existing
# market credibility (see docs/discovery.md) — feeling out the market and
# warming up interviewing without giving up the current full-time role.
# Phase 4's `fde` profile targets the actual long-term career direction
# (Forward Deployed Engineer, Solutions Architect, Applied AI, ML
# Systems) via the Ashby/Lever sources added alongside it.

profiles:
  php:
    enabled: true
    queries:
      - PHP

  laravel:
    enabled: true
    queries:
      - Laravel

  craft:
    enabled: true
    queries:
      - "Craft CMS"

  wordpress:
    enabled: true
    queries:
      - WordPress

  fde:
    enabled: true
    queries:
      - "Forward Deployed"
      - "Solutions Architect"
      - "Solutions Engineer"
      - "Applied AI"
      - "ML Systems"
      - "Machine Learning Platform"
      - "AI Platform"
      - "Customer Engineer"

# Employment types considered in scope for discovery's default filter.
# Not a hard exclusion elsewhere in scoring — only `jobs discover`/`jobs
# run`'s default filter, always overridable with `--employment-type`.
#
# `full_time` was added here deliberately (previously excluded — see
# docs/discovery.md#employment-type-policy for the full history). The
# original exclusion assumed "full_time = ignore" was the right proxy for
# "not interesting while still employed" — but a sufficiently compelling
# full-time role (including one that happens to use PHP/Laravel/Craft
# skills already on the resume) is exactly the kind of opportunity worth
# knowing about as a potential replacement for the current role, not
# something to hide by construction. Whether it's actually worth pursuing
# is decided entirely by the existing eligibility -> qualification ->
# transferable fit -> career direction -> opportunity value -> pursue
# pipeline (docs/pursue-recommendation.md) and the passive-mode alert
# threshold (docs/alerts.md) — full-time gets no scoring advantage for
# being full-time, it's simply no longer filtered out before reaching
# that pipeline.
#
# `unknown` remains included for the reason already documented below:
# Greenhouse almost never exposes employment_type at all, so excluding
# "unknown" would silently drop most Greenhouse postings regardless of
# their real employment type — consistent with this project's rule of
# never penalizing/excluding for a field the source simply didn't
# publish.
default_employment_types:
  - full_time
  - contract
  - freelance
  - part_time
  - unknown
