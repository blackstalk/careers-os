narrative: >
  Strongest positioning combines software engineering, system and solution
  architecture, integrations/APIs, cloud infrastructure, automation, and
  AI-assisted systems experience with production operations background and
  strong stakeholder communication — i.e. someone who can translate a
  business problem into a working technical system and stay in the room
  with the customer while doing it. Two valid paths: (1) stack-adjacent
  engineering — PHP/Laravel/Craft CMS, backend, APIs, integrations,
  middleware, AWS, platform and system architecture; (2) career-direction
  engineering — applied AI / AI engineering (LLM applications, RAG,
  agents, AI workflows), forward deployed and implementation-heavy
  solutions/customer engineering. Prefers build-heavy roles; customer
  contact is welcome when the role still writes and ships production code,
  but not roles dominated by meetings, account management, or pre-sales.
