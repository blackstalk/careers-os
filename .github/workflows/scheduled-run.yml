name: Scheduled Careers OS run

# Runs `jobs run` on GitHub's hosted infrastructure so opportunity alerts
# still go out even when the local Mac (docs/alerts.md's original
# launchd approach) is asleep or offline. See
# docs/alerts.md#scheduling.
#
# State (data/careers.db — including alert dedup history) is restored
# from and saved back to the GitHub Actions cache each run, since
# hosted runners start from a clean checkout every time and nothing else
# here persists between runs. The database is deliberately NOT committed
# to the repo (see .gitignore) — an earlier version of this workflow did
# that and it worked until the database's own natural growth pushed it
# past GitHub's 100MB per-file push limit and hard-blocked every run
# after. The cache has no comparable per-file limit (10GB per repo).
# `JobRepository.prune_history` still keeps the database itself from
# growing without bound regardless.

"on":
  schedule:
    # 13:00 UTC = 8:00am US Central (Daylight Time). GitHub Actions cron
    # does not observe DST, so this drifts to 7:00am Central during
    # Standard Time (roughly early Nov - early Mar) — a known, accepted
    # limitation, same spirit as the local launchd plist's own documented
    # tradeoffs.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {} # allows a manual run from the Actions tab or `gh workflow run`

concurrency:
  group: scheduled-careers-os-run
  cancel-in-progress: false # never cancel a run that's already sending/persisting

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # actions/cache entries are immutable per key — restore the most
      # recent one via the `restore-keys` prefix (there is no cache
      # entry with this run's own id yet), then always save under a
      # fresh, run-id-unique key below so this run's changes are never
      # lost to that immutability. Old entries age out on their own via
      # GitHub's normal cache eviction; nothing here deletes them
      # explicitly.
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: data/careers.db
          key: careers-os-db-${{ github.run_id }}
          restore-keys: |
            careers-os-db-

      # Only reached the very first run ever, or if the cache is ever
      # fully evicted (GitHub ages out unused entries) — data/
      # careers.seed.db is a committed, manually-refreshed snapshot
      # (resume/evidence data + alert history at the time it was taken)
      # so a cache miss starts from a real, qualification-capable
      # database rather than an empty one with no resume evidence at
      # all. It intentionally goes stale between refreshes; that's an
      # acceptable, bounded tradeoff against starting over from nothing.
      - name: Seed job database if no cache was found
        run: |
          if [ ! -f data/careers.db ]; then
            echo "No cached database found — seeding from data/careers.seed.db"
            cp data/careers.seed.db data/careers.db
          fi

      - name: Run scheduled discovery + alerts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          CAREERS_ALERT_EMAIL: ${{ secrets.CAREERS_ALERT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # AI evidence-reasoning layer enabled (ANTHROPIC_API_KEY secret
        # configured) — see docs/pursue-recommendation.md's AI guardrails
        # section for what it can/can't do; deterministic scoring/
        # qualification/pursue logic is unaffected either way.
        #
        # Invoked as a module, not the `jobs` console script — bash's own
        # `jobs` builtin (lists background jobs) intercepts a bare `jobs
        # run` before PATH resolution ever sees the installed script, the
        # same builtin-name collision the README's `command jobs run`
        # workaround exists for locally.
        run: python -m careers_os.cli run

      - name: Save job database
        uses: actions/cache/save@v4
        with:
          path: data/careers.db
          key: careers-os-db-${{ github.run_id }}
