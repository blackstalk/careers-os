name: Scheduled Careers OS run

# Runs `jobs run` on GitHub's hosted infrastructure so opportunity alerts
# still go out even when the local Mac (docs/alerts.md's original
# launchd approach) is asleep or offline. See
# docs/alerts.md#scheduling.
#
# State (data/careers.db — including alert dedup history) is committed
# back to the repo at the end of every run, since GitHub-hosted runners
# start from a clean checkout each time and nothing else here persists
# between runs. This is why `contents: write` permission and a
# repo-scoped git identity are needed below.

"on":
  schedule:
    # 13:00 UTC = 8:00am US Central (Daylight Time). GitHub Actions cron
    # does not observe DST, so this drifts to 7:00am Central during
    # Standard Time (roughly early Nov - early Mar) — a known, accepted
    # limitation, same spirit as the local launchd plist's own documented
    # tradeoffs.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {} # allows a manual run from the Actions tab or `gh workflow run`

concurrency:
  group: scheduled-careers-os-run
  cancel-in-progress: false # never cancel a run that's already sending/persisting

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run scheduled discovery + alerts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          CAREERS_ALERT_EMAIL: ${{ secrets.CAREERS_ALERT_EMAIL }}
        # Deterministic scoring only — no ANTHROPIC_API_KEY secret is
        # configured for this workflow, so --no-ai makes that an explicit
        # choice rather than an implicit side effect of a missing secret.
        run: jobs run --no-ai

      - name: Persist job database state
        run: |
          git config user.name "careers-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/careers.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore: update job database from scheduled run [skip ci]"
            git push
          fi
